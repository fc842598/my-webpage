<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="leaf-gold" x1="25" y1="4" x2="7" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6e89a"/>
      <stop offset="45%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#6e4e10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 叶片主体：底左→顶右，外侧弧度饱满，内侧收窄 -->
  <path
    d="M7 27
       C 4 20, 7 12, 14 7
       Q 19 3, 25 4
       C 24 9, 21 14, 16 18
       Q 12 22, 7 27 Z"
    fill="url(#leaf-gold)"
    filter="url(#glow)"
  />
  <!-- 中央叶脉 -->
  <path
    d="M 7 27 Q 15 17 25 4"
    stroke="rgba(255,248,210,0.35)"
    stroke-width="0.9"
    stroke-linecap="round"
    fill="none"
  />
  <!-- 叶尖高光 -->
  <circle cx="24.5" cy="4.5" r="1.2" fill="rgba(255,245,180,0.55)"/>
</svg>
