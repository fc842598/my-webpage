<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="gD" x1="6" y1="8" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4e080"/>
      <stop offset="100%" stop-color="#9a7828"/>
    </linearGradient>
  </defs>
  <!-- 天：弧线向上拱 -->
  <path d="M 8 12 Q 18 7 28 12" stroke="url(#gD)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 人：横线居中 -->
  <line x1="9" y1="18" x2="27" y2="18" stroke="url(#gD)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 地：弧线向下弯 -->
  <path d="M 8 24 Q 18 29 28 24" stroke="url(#gD)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 中轴虚线 -->
  <line x1="18" y1="10" x2="18" y2="26" stroke="rgba(201,169,97,0.22)" stroke-width="1"
        stroke-dasharray="2 2.5" stroke-linecap="round"/>
</svg>
