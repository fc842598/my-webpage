<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="gC" x1="4" y1="10" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2dc7a"/>
      <stop offset="100%" stop-color="#b08830"/>
