<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 893" role="img" aria-label="小六壬掌诀掐指推演动图">
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="74%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="68%" stop-color="#fbf3e6"/>
      <stop offset="100%" stop-color="#f2e4cf"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="50%" stop-color="#ead0a6"/>
      <stop offset="100%" stop-color="#c28d4f"/>
    </linearGradient>
    <linearGradient id="skinSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#e6c79b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="100%" stop-color="#dcae4e"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7d5328" flood-opacity=".14"/>
    </filter>
    <filter id="thumbShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-6" dy="12" stdDeviation="10" flood-color="#8a5a2a" flood-opacity=".22"/>
    </filter>
    <filter id="goldGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#c49a52"/>
    </marker>
    <style>
      .line{fill:none;stroke:#d6bd8f;stroke-width:1.25;opacity:.42}
      .thin{fill:none;stroke:#b48642;stroke-width:1.4;opacity:.54;stroke-dasharray:6 8}
      .topline{fill:none;stroke:#c39a56;stroke-width:1.4;opacity:.58}
      .label{font:800 29px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#17130f;text-anchor:middle}
      .sub{font:600 20px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#7a6b5a;text-anchor:middle}
      .seal{font:600 22px 'Noto Serif SC','Songti SC',serif;fill:#a0493b}
      .badge{fill:#fffaf1;stroke:#dfc89a;stroke-width:2}
      .plate{fill:#fff8eb;stroke:#d9bd82;stroke-width:2.2;filter:url(#softShadow)}
      .num{font:800 18px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#9c7333;text-anchor:middle}
      .name{font:800 27px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#14110d;text-anchor:middle}
      .good{font:700 20px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#74685d;text-anchor:middle}
      .hand-line{fill:none;stroke:#7e603d;stroke-width:2;opacity:.25;stroke-linecap:round}
      .skin-stroke{stroke:#86643c;stroke-width:2;stroke-opacity:.32}
      #whole-hand{animation:handLife 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:392px 645px}
      #index-finger{animation:indexCurl 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:302px 580px}
      #middle-finger{animation:middleCurl 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:397px 585px}
      #ring-finger{animation:ringCurl 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:502px 575px}
      #count-thumb{filter:url(#thumbShadow)}
      #tap-glow{animation:tapGlow 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:center;opacity:0;filter:url(#goldGlow)}
      #current-aura{animation:finalAura 7.2s ease-in-out infinite;transform-box:view-box;transform-origin:548px 570px}
      #route-dot{animation:routeBlink 7.2s ease-in-out infinite}
      @keyframes handLife{
        0%,100%{transform:translate(0,0) rotate(0deg)}
        16%{transform:translate(-2px,1px) rotate(-.35deg)}
        42%{transform:translate(2px,-1px) rotate(.28deg)}
        66%{transform:translate(1px,2px) rotate(.38deg)}
      }
      @keyframes indexCurl{
        0%,100%{transform:rotate(0deg) translate(0,0)}
        20%,31%{transform:rotate(2.6deg) translate(3px,9px)}
        45%{transform:rotate(-1.4deg) translate(-2px,4px)}
      }
      @keyframes middleCurl{
        0%,100%{transform:rotate(0deg) translate(0,0)}
        34%,47%{transform:rotate(-2.4deg) translate(-3px,8px)}
        76%,87%{transform:rotate(1.4deg) translate(2px,5px)}
      }
      @keyframes ringCurl{
        0%,100%{transform:rotate(0deg) translate(0,0)}
        50%,70%{transform:rotate(-5deg) translate(-7px,14px)}
        78%,92%{transform:rotate(-3deg) translate(-4px,10px)}
      }
      @keyframes tapGlow{
        0%,9%{transform:translate(290px,510px) scale(.45);opacity:0}
        14%{transform:translate(290px,510px) scale(1);opacity:.82}
        21%{transform:translate(290px,355px) scale(.45);opacity:0}
        28%{transform:translate(290px,355px) scale(1);opacity:.72}
        35%{transform:translate(393px,300px) scale(.45);opacity:0}
        42%{transform:translate(393px,300px) scale(1);opacity:.72}
        49%{transform:translate(510px,380px) scale(.45);opacity:0}
        56%{transform:translate(510px,380px) scale(1);opacity:.74}
        63%{transform:translate(548px,570px) scale(.45);opacity:0}
        70%{transform:translate(548px,570px) scale(1.12);opacity:.9}
        77%{transform:translate(398px,512px) scale(.45);opacity:0}
        84%{transform:translate(398px,512px) scale(1);opacity:.68}
        93%,100%{transform:translate(548px,570px) scale(1.12);opacity:.5}
      }
      @keyframes finalAura{
        0%,63%{opacity:1}
        70%,100%{opacity:1;transform:scale(1.035)}
      }
      @keyframes routeBlink{
        0%,100%{opacity:.28}
        52%,74%{opacity:.9}
      }
    </style>
  </defs>

  <rect x="6" y="6" width="774" height="881" rx="30" fill="url(#paper)" stroke="#e5d1a7" stroke-width="2"/>
  <path class="line" d="M88 454h610M393 134v690M142 270c160 136 338 136 500 0M142 660c160-136 338-136 500 0"/>
  <circle cx="393" cy="455" r="216" fill="none" stroke="#e9d7b4" stroke-width="2" opacity=".48"/>
  <circle cx="393" cy="455" r="178" fill="none" stroke="#e9d7b4" stroke-width="1.2" opacity=".36"/>
  <text x="75" y="338" class="seal" writing-mode="tb">小六壬掌诀　三指六位</text>

  <g>
    <circle class="badge" cx="196" cy="92" r="56"/>
    <text class="sub" x="196" y="73">月令</text>
    <text class="label" x="196" y="115">4月</text>
    <text class="sub" x="196" y="145">赤口</text>
    <circle class="badge" cx="393" cy="92" r="56"/>
    <text class="sub" x="393" y="73">日辰</text>
    <text class="label" x="393" y="115">2日</text>
    <text class="sub" x="393" y="145">小吉</text>
    <circle class="badge" cx="590" cy="92" r="56"/>
    <text class="sub" x="590" y="73">时辰</text>
    <text class="label" x="590" y="115">午时</text>
    <text class="sub" x="590" y="145">小吉</text>
    <path class="topline" d="M252 102h84" marker-end="url(#arrow)"/>
    <path class="topline" d="M449 102h84" marker-end="url(#arrow)"/>
  </g>

  <path class="thin" d="M196 148l86 320" marker-end="url(#arrow)"/>
  <path class="thin" d="M393 148v306" marker-end="url(#arrow)"/>
  <path class="thin" d="M590 148l-44 345" marker-end="url(#arrow)"/>

  <g id="whole-hand" filter="url(#softShadow)">
    <path d="M184 820c-9-78-2-151 20-209 20-53 52-92 90-110l18-190c5-50 29-80 66-78 21 1 37 12 47 31 12-28 35-47 64-46 39 2 63 35 65 83l7 176c24-28 61-38 89-18 31 22 37 71 22 124-18 65-61 134-87 250z" fill="url(#skinSoft)" class="skin-stroke"/>
    <path class="hand-line" d="M230 688c86-56 199-57 322-20M256 636c82-38 173-36 267 7M300 728c74-38 170-32 248 20"/>
    <path class="hand-line" d="M252 568c30-24 62-32 98-25M468 544c38-10 78-5 118 15"/>

    <g id="index-finger">
      <rect x="262" y="220" width="76" height="354" rx="37" fill="url(#skinSoft)" class="skin-stroke"/>
      <path class="hand-line" d="M273 288h54M273 407h54"/>
      <path class="plate" d="M249 457h86l17 19-17 19v57l-19 19h-48l-19-19v-57l-17-19z"/>
      <text class="num" x="292" y="477">1</text>
      <text class="name" x="292" y="519">大安</text>
      <text class="good" x="292" y="550">吉</text>
      <path class="plate" d="M249 303h86l17 19-17 19v57l-19 19h-48l-19-19v-57l-17-19z"/>
      <text class="num" x="292" y="323">2</text>
      <text class="name" x="292" y="365">留连</text>
      <text class="good" x="292" y="396">凶</text>
    </g>

    <g id="middle-finger">
      <rect x="356" y="168" width="78" height="412" rx="38" fill="url(#skinSoft)" class="skin-stroke"/>
      <path class="hand-line" d="M369 244h52M369 377h52"/>
      <path class="plate" d="M352 248h86l17 19-17 19v58l-19 19h-48l-19-19v-58l-17-19z"/>
      <text class="num" x="395" y="268">3</text>
      <text class="name" x="395" y="310">速喜</text>
      <text class="good" x="395" y="341">吉</text>
      <path class="plate" d="M352 458h86l17 19-17 19v58l-19 19h-48l-19-19v-58l-17-19z"/>
      <text class="num" x="395" y="478">6</text>
      <text class="name" x="395" y="520">空亡</text>
      <text class="good" x="395" y="551">凶</text>
    </g>

    <g id="ring-finger">
      <rect x="472" y="231" width="76" height="344" rx="37" fill="url(#skinSoft)" class="skin-stroke"/>
      <path class="hand-line" d="M483 301h54M483 416h54"/>
      <path class="plate" d="M468 329h86l17 19-17 19v58l-19 19h-48l-19-19v-58l-17-19z"/>
      <text class="num" x="511" y="349">4</text>
      <text class="name" x="511" y="391">赤口</text>
      <text class="good" x="511" y="422">凶</text>
      <g id="current-aura">
        <path d="M496 501h101l21 23-21 23v76l-23 23h-55l-23-23v-76l-21-23z" fill="url(#gold)" stroke="#c99735" stroke-width="3.2"/>
        <path d="M506 511h82l17 18-17 18v67l-18 18h-46l-18-18v-67l-17-18z" fill="none" stroke="#fff3bf" stroke-width="2" opacity=".75"/>
        <text class="num" x="547" y="526">5</text>
        <text class="name" x="547" y="574">小吉</text>
        <text class="good" x="547" y="610">吉</text>
      </g>
    </g>
  </g>

  <g id="tap-glow">
    <circle r="45" fill="#f5cf67" opacity=".28"/>
    <circle r="16" fill="#fff8c7" stroke="#d6a240" stroke-width="2" opacity=".9"/>
  </g>

  <g id="count-thumb" transform="translate(622 650)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="7.2s" repeatCount="indefinite"
        keyTimes="0;.07;.14;.18;.28;.32;.42;.46;.56;.60;.70;.75;.84;.89;.98;1"
        values="-18;-18;22;22;42;42;56;56;69;69;51;51;28;28;51;51"/>
      <g>
        <animateTransform attributeName="transform" type="scale" dur="7.2s" repeatCount="indefinite"
          keyTimes="0;.07;.14;.18;.28;.32;.42;.46;.56;.60;.70;.75;.84;.89;.98;1"
          values=".74 1;.74 1;1.72 1;1.72 1;2.08 1;2.08 1;1.92 1;1.92 1;1.36 1;1.36 1;.68 1;.68 1;1.34 1;1.34 1;.68 1;.68 1"/>
        <path d="M0-34C-30-56-78-59-123-45C-167-31-199-4-204 24C-208 47-190 60-164 50C-118 32-75 17-25 34C-5 41 12 24 11 4C10-13 8-26 0-34Z" fill="url(#skin)" class="skin-stroke"/>
        <ellipse cx="-173" cy="22" rx="30" ry="19" transform="rotate(-12 -173 22)" fill="#fff4dc" stroke="#b4844a" stroke-opacity=".24"/>
        <path class="hand-line" d="M-55-31c15 19 14 45-2 66M-104-40c17 20 15 47-4 74"/>
        <ellipse cx="0" cy="0" rx="38" ry="30" fill="#e3bd82" opacity=".34"/>
      </g>
    </g>
  </g>

  <path class="topline" d="M222 821h54" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="307" y="829" class="sub" text-anchor="start">推演路径</text>
  <circle id="route-dot" cx="425" cy="822" r="12" fill="#fff9dc" stroke="#d4a047" stroke-width="3"/>
  <text x="456" y="829" class="sub" text-anchor="start">当前落宫</text>
</svg>
