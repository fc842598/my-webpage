        - generic [ref=e461]:
          - generic [ref=e462]:
            - heading "紫微斗数是什么？" [level=3] [ref=e463]
            - paragraph [ref=e464]:
              - generic [ref=e465]:
                - text: 紫微斗数是中国古代最精妙的命理学之一，在古代被尊称为“帝王学”，主要用于给皇帝和贵族进行命理测算。它通过分析一个人出生时的天体位置，推断其性格特质和人生走向。它以紫微星为核心，结合其他主星和辅星的位置，形成完整的命盘体系。
                - link "查看详细介绍" [ref=e466] [cursor=pointer]:
                  - /url: /blog/purple-star-astrology-introduction
          - generic [ref=e467]:
            - heading "PurpleStarAstro 是如何工作的？" [level=3] [ref=e468]
            - paragraph [ref=e469]: 我们的系统根据用户的出生日期和时辰，通过算法精准地计算出对应的紫微斗数命盘，然后将用户命盘、大量紫微斗数案例和理论与DeepSeek、GPT等大模型结合，让模型精准地分析用户的命盘并提供针对性的建议和指导。
          - generic [ref=e470]:
            - heading "PurpleStarAstro 可以免费使用吗？" [level=3] [ref=e471]
            - paragraph [ref=e472]: 是的，我们的免费版提供了试用功能，您可以查看命盘的基本信息，以及有5天的免费运势预测。
          - generic [ref=e473]:
            - heading "需要提供哪些信息才能获得准确的命盘解析？" [level=3] [ref=e474]
            - paragraph [ref=e475]: 您需要提供准确的出生年、月、日、时间区间，出生地点也会影响解析的准确度。只有提供准确的信息我们才能正确计算出您的命盘，后续的所有预测才是准确的，所以一定要提供准确的信息。
          - generic [ref=e476]:
            - heading "PurpleStarAstro 如何保护我的隐私？" [level=3] [ref=e477]
            - paragraph [ref=e478]: 我们致力于保护您个人信息的保密性和安全性。我们的平台严格遵守全球隐私法规，采用最先进的技术和组织保障措施，防止未经授权访问、披露或滥用您的数据。
          - generic [ref=e479]:
            - heading "如何理解和应用命盘解析结果？" [level=3] [ref=e480]
            - paragraph [ref=e481]: 命盘解析提供的是参考和指导，而非绝对命运。我们建议您将解析结果作为自我认知和生活决策的参考工具，结合自身实际情况，理性查看命运，积极把握人生。
          - generic [ref=e482]:
            - heading "如何获取帮助和提供反馈？" [level=3] [ref=e483]
            - paragraph [ref=e484]:
