              - generic [ref=e49]: ➃ 天地人三盘同参分析：引入「天地人三盘」联动分析，将本命盘（天盘）、大限盘（地盘）、流年盘（人盘）叠加解读。天盘代表先天命格，地盘反映十年大运趋势，人盘显示具体年份的吉凶应期。通过三盘同参，可精准定位事件发生的时间点，把握「先天为体、后天为用、流年为机」的运势节奏。
              - generic [ref=e51]: ➄ 运势强弱宫分数表：对十二宫位进行量化评估。评分依据包括：本宫主星庙旺落陷、吉煞星组合、三方四正吉凶、四化星引动等因素。每个宫位给出综合分数，并标注「强宫」（优势领域）、「弱宫」（需注意领域），帮助您一目了然地识别人生重点发力方向与潜在风险。
              - paragraph [ref=e53]: ➅ 流年月份运势评估：新增功能为您分析全年12个月，每月12个宫位的详细表现。每个宫位都有评分，强弱势一目了然。让您随时掌握每月运程重点，该进攻时找准方向，该防守时提前避坑（此功能在排流年命盘后显示）。
