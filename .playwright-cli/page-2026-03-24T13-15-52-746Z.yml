              - generic [ref=e43]: ➀ 命盘增加基础入门讲解：增加「紫微斗数基础入门」模块，帮助您快速理解命盘结构，让零基础的您也能看懂命盘框架，为后续深度解读打下基础。
              - generic [ref=e45]: ➁ 宫位主星相应链接可直接阅读相关讯息：为命盘中的每个宫位主星设置可点击的链接，点击后可直接跳转至该主星的详细解析页面，您无需手动查找，即可快速获取主星的专业解读，提升阅读效率。
              - generic [ref=e47]: ➂ 宫位三方四正分析：在解读每个宫位时，自动生成其「三方四正」的综合分析。三方指与本宫形成三合关系的两个宫位，四正则加上本宫的对宫。分析将评估这四个宫位内的主星、吉星、煞星组合，判断该宫位的格局强弱、外部助力与挑战，避免孤立看单宫，实现「由点及面」的全局解读。
