<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅天 · 六爻占卜</title>
  <meta name="description" content="阅天电脑端六爻占卜，一事一问，六次成卦，看本卦、动爻与变卦。">
  <link rel="icon" href="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" type="image/png">
  <link rel="stylesheet" href="../css/mingbook-onepage.css?v=20260601-brand-logo-all">
  <link rel="stylesheet" href="../css/liuyao.css?v=20260602-unified-back-pill">
  <script defer src="../js/config.js?v=20260521-api-domain-auth-proxy"></script>
  <script defer src="./guaci-data.js?v=20260520-yijing-typo-fix-7"></script>
  <script defer src="./yijing-master-data.js?v=20260520-yijing-typo-fix-7"></script>
  <script defer src="../js/liuyao-page.js?v=20260602-xu-dashi-labels"></script>
</head>
<body class="liuyao-page">
  <header class="mbp-nav">
    <a class="mbp-brand" href="../index.html" aria-label="阅天首页">
      <img class="mbp-brand-logo" src="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" alt="" aria-hidden="true" loading="eager" decoding="async">
      <span>阅天</span>
    </a>
    <nav class="mbp-nav-links" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="./liuyao.html" class="is-active">六爻占卜</a>
    </nav>
    <div class="mbp-nav-actions">
      <a class="mbp-member liuyao-back-link" id="mbpLiuyaoBack" href="./mingbook-onepage.html">‹ 返回</a>
    </div>
  </header>

  <main class="liuyao-shell">
    <section class="liuyao-workbench" aria-label="六爻占卜工作台">
      <div class="mbp-liuyao-overlay" id="mbpLiuyaoOverlay">
        <div class="mbp-liuyao-modal" role="region" aria-labelledby="mbpLiuyaoTitle">
          <div class="mbp-liuyao-head">
            <strong id="mbpLiuyaoTitle">六爻占卜（易经铜钱卦）</strong>
            <p>借卦象观变化，整理思路，把问题想得更周全</p>
          </div>
          <div class="mbp-liuyao-body">
            <section class="mbp-liuyao-ask">
              <label>
                <span>所问之事</span>
                <textarea id="mbpLiuyaoQuestion" maxlength="120" rows="4" placeholder="例如：我现在是否适合推进这个合作？本月能不能见到明确结果？"></textarea>
              </label>
              <p class="mbp-liuyao-field-hint">只问一件事。写完先提交问题，审题通过后再起卦。</p>
              <div class="mbp-liuyao-gate-inline">
                <div class="mbp-liuyao-gate-copy">
                  <span class="mbp-liuyao-gate-badge" id="mbpLiuyaoGateBadge" data-tone="hint">待审题</span>
                  <p class="mbp-liuyao-gate-status" id="mbpLiuyaoGateStatus">问题写好后点“提交问题”，系统会调用大模型判断能否继续占卜。</p>
                </div>
                <button type="button" class="mbp-liuyao-gate-submit" id="mbpLiuyaoSubmitQuestion">提交问题</button>
              </div>
              <div class="mbp-liuyao-gate-tags" id="mbpLiuyaoGateTags">
                <span>一卦一问</span>
                <span>审题后可起卦</span>
              </div>
              <span class="mbp-liuyao-quota" id="mbpLiuyaoQuota">今日次数 0/3</span>
              <div class="mbp-liuyao-mode" aria-label="起卦方式">
                <button type="button" class="is-active" data-liuyao-mode="online">在线投币</button>
                <button type="button" data-liuyao-mode="manual">手动起卦</button>
              </div>
              <div class="mbp-liuyao-actions">
                <button type="button" class="mbp-liuyao-primary" id="mbpLiuyaoToss">投第 1 爻</button>
                <button type="button" class="mbp-liuyao-secondary" id="mbpLiuyaoAuto">一键成卦</button>
                <button type="button" class="mbp-liuyao-secondary" id="mbpLiuyaoReset">重来</button>
              </div>
              <div class="mbp-liuyao-mode-panel" id="mbpLiuyaoModePanel"></div>
            </section>
            <section class="mbp-liuyao-cast" aria-label="起卦结果">
              <div class="mbp-liuyao-cast-head">
                <span>起卦进度</span>
                <strong id="mbpLiuyaoProgressText">已成 0/6 爻</strong>
                <i><u id="mbpLiuyaoProgressBar"></u></i>
              </div>
              <div class="mbp-liuyao-coins" id="mbpLiuyaoCoins"></div>
              <div class="mbp-liuyao-stack" id="mbpLiuyaoStack"></div>
              <div class="mbp-liuyao-result" id="mbpLiuyaoResult"></div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
