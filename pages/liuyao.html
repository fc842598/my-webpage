  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const storedLang = (() => {
        try {
          return localStorage.getItem("wentian-app-language-v1") || "";
        } catch (_err) {
          return "";
        }
      })();
      const referrer = document.referrer || "";
      const fromEnglishWentian =
        /\/pages\/wentian-app\.html/i.test(referrer) &&
        /(?:[?&](?:lang|language|wentianLanguage|locale)=en)(?:[&#]|$)/i.test(referrer);
      if (params.get("lang") === "en" || storedLang === "en" || fromEnglishWentian) {
        window.location.replace("/pages/wentian-app.html?lang=en#screen-17");
        return;
      }
      if (params.get("view") === "desktop") return;
      const ua = navigator.userAgent || "";
      const target = "/pages/liuyao-v2.html?v=20260616-cast-compact";
      const isTouchMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
      const isIPadLike =
        /iPad/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isNarrowViewport = () =>
        (window.innerWidth || document.documentElement.clientWidth || 0) <= 900;
      const shouldRedirect = () => isTouchMobile || isIPadLike || isNarrowViewport();
      if (shouldRedirect()) {
        window.location.replace(target);
        return;
      }
      let redirected = false;
      let resizeTimer = 0;
      const maybeRedirect = () => {
        if (redirected || !isNarrowViewport()) return;
        redirected = true;
        window.location.replace(target);
      };
      const handleResize = () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(maybeRedirect, 120);
      };
      window.addEventListener("resize", handleResize, { passive: true });
      window.matchMedia?.("(max-width: 900px)")?.addEventListener?.("change", (event) => {
        if (event.matches) maybeRedirect();
      });
    })();
  </script>
