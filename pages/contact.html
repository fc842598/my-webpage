<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 · 阅天</title>
  <link rel="icon" href="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" type="image/png">
  <style>
    :root {
      --bg: #050302;
      --panel: #100b06;
      --panel-2: #080b09;
      --gold: #c9a961;
      --gold-soft: #f1d47d;
      --ivory: #f4e5c5;
      --text: #b9a775;
      --muted: #887958;
      --line: rgba(201, 169, 97, .28);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -8%, rgba(201, 169, 97, .13), transparent 34%),
        linear-gradient(180deg, #050302 0%, #070503 54%, #030201 100%);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(201, 169, 97, .16);
      background: rgba(5, 3, 2, .92);
      backdrop-filter: blur(16px);
    }

    .nav-inner,
    .wrap {
      width: min(1080px, calc(100vw - 48px));
      margin: 0 auto;
    }

    .nav-inner {
      width: min(1120px, calc(100vw - 48px));
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ivory);
      font: 900 20px/1 "Noto Serif SC", "Songti SC", serif;
      letter-spacing: 0;
      margin-right: auto;
    }

    .brand span {
      letter-spacing: .16em;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
      flex: 0 0 auto;
    }

    .back-link {
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201, 169, 97, .25);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(20, 16, 11, .92), rgba(10, 8, 5, .92));
      box-shadow: inset 0 0 0 1px rgba(255, 244, 214, .03);
      color: rgba(237, 219, 178, .88);
      font: 700 15px/1 "Noto Serif SC", "Songti SC", serif;
      white-space: nowrap;
      transition: transform .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .back-link:hover {
      color: var(--gold-soft);
      border-color: rgba(231, 201, 133, .38);
      box-shadow: inset 0 0 0 1px rgba(255, 244, 214, .05), 0 12px 30px rgba(0, 0, 0, .16);
      transform: translateY(-1px);
    }

    .wrap {
      padding: 72px 0 86px;
    }

    .kicker {
      display: block;
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--ivory);
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-weight: 900;
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(44px, 6vw, 68px);
      line-height: 1.08;
    }

    .lead {
      max-width: 760px;
      margin: 26px 0 0;
      color: #dfca8e;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.78;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
      margin-top: 58px;
    }

    .contact-card {
      min-height: 220px;
      padding: 34px 32px;
      border: 1px solid rgba(201, 169, 97, .32);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(201, 169, 97, .035), transparent 44%),
        rgba(16, 11, 6, .84);
    }

    .contact-card h2 {
      font-size: 28px;
      line-height: 1.3;
    }

    .mail {
      display: block;
      margin-top: 22px;
      color: var(--gold-soft);
      font-size: clamp(23px, 2.6vw, 30px);
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .contact-card p {
      margin: 22px 0 0;
      color: #ad9a6d;
      font-size: 16px;
    }

    .quick-tags {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      margin: 70px 32px 0;
    }

    .quick-tags span {
      min-height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(241, 212, 125, .72);
      border-radius: 999px;
      color: var(--gold-soft);
      font-size: 14px;
      font-weight: 900;
    }

    .notice {
      margin-top: 64px;
      padding: 32px;
      border: 1px solid rgba(201, 169, 97, .18);
      border-radius: 8px;
      background: rgba(8, 11, 9, .88);
      color: #dfca8e;
      font-size: 18px;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .nav-inner,
      .wrap {
        width: 100%;
      }

      .nav-inner {
        height: 62px;
        padding: 0 18px;
      }

      .wrap {
        padding: 36px 18px 64px;
      }

      h1 {
        margin-top: 14px;
        font-size: 40px;
      }

      .lead {
        margin-top: 20px;
        font-size: 16px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 52px;
      }

      .contact-card {
        min-height: 0;
        padding: 26px 18px;
      }

      .contact-card h2 {
        font-size: 24px;
      }

      .mail {
        font-size: 18px;
      }

      .contact-card p {
        font-size: 14px;
      }

      .quick-tags {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 18px;
        margin: 52px 4px 0;
      }

      .quick-tags span {
        font-size: 13px;
      }

      .notice {
        margin-top: 42px;
        padding: 20px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" alt="" aria-hidden="true" loading="eager" decoding="async"><span>阅 天</span></a>
      <a class="back-link" href="../index.html">‹ 返回</a>
    </div>
  </header>

  <main class="wrap">
    <span class="kicker">CONTACT</span>
    <h1>联系我们</h1>
    <p class="lead">把问题、页面、账号手机号或邮箱写清楚，我们按服务、账号、支付、隐私四类处理。</p>

    <section class="contact-grid" aria-label="联系信息">
      <article class="contact-card">
        <h2>客服邮箱</h2>
        <a class="mail" href="mailto:842598522@qq.com">842598522@qq.com</a>
        <p>建议附上页面链接、账号信息、付款截图或问题截图。</p>
      </article>

      <article class="contact-card">
        <h2>主体与版权信息</h2>
        <p>粤ICP备2026055337号<br>© 2026 阅天AI<br>Powered By 阅天工作室</p>
      </article>
    </section>

    <div class="quick-tags" aria-label="问题类型">
      <span>账号登录</span>
      <span>会员支付</span>
      <span>命盘排盘</span>
      <span>隐私请求</span>
    </div>

    <p class="notice">处理建议：一句话说明问题 + 页面链接 + 账号手机号/邮箱 + 截图。这样定位最快。</p>
  </main>
</body>
</html>
