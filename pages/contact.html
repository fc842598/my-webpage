<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 · 阅天</title>
  <link rel="icon" href="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" type="image/png">
  <style>
    :root {
      --bg: #040200;
      --bg-2: #0b0603;
      --panel: rgba(18, 11, 6, 0.86);
      --panel-strong: rgba(15, 9, 4, 0.94);
      --panel-soft: rgba(12, 10, 8, 0.7);
      --gold: #c6a45d;
      --gold-bright: #f1d38b;
      --ivory: #f6ead0;
      --text: #d3bf8e;
      --muted: #9a8760;
      --line: rgba(198, 164, 93, 0.2);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.26);
      --success: #96d4a0;
      --danger: #f0a58f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(198, 164, 93, 0.15), transparent 30%),
        radial-gradient(circle at 85% 18%, rgba(198, 164, 93, 0.08), transparent 24%),
        linear-gradient(180deg, #030100 0%, #090401 42%, #050200 100%);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(198, 164, 93, 0.14);
      background: rgba(4, 2, 0, 0.88);
      backdrop-filter: blur(16px);
    }

    .nav-inner,
    .wrap {
      width: min(1180px, calc(100vw - 48px));
      margin: 0 auto;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 66px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
      color: var(--ivory);
      font: 900 20px/1 "Noto Serif SC", "Songti SC", serif;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .back-link {
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(198, 164, 93, 0.22);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(26, 18, 11, 0.95), rgba(10, 7, 4, 0.95));
      color: rgba(246, 234, 208, 0.9);
      font: 700 15px/1 "Noto Serif SC", "Songti SC", serif;
      transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .back-link:hover {
      transform: translateY(-1px);
      border-color: rgba(241, 211, 139, 0.4);
      color: var(--gold-bright);
    }

    .wrap {
      padding: 52px 0 90px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(340px, 0.78fr);
      gap: 28px;
      align-items: stretch;
    }

    .hero-panel,
    .form-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 243, 214, 0.04), transparent 25%),
        linear-gradient(135deg, rgba(198, 164, 93, 0.08), transparent 42%),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .hero-panel {
      padding: 36px 34px 34px;
    }

    .hero-panel::after,
    .form-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 243, 214, 0.06), transparent 24%),
        radial-gradient(circle at 90% 0%, rgba(198, 164, 93, 0.16), transparent 28%);
      pointer-events: none;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 38px;
      height: 1px;
      background: linear-gradient(90deg, rgba(198, 164, 93, 0.95), transparent);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      color: var(--ivory);
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-weight: 900;
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(42px, 5.8vw, 66px);
      line-height: 1.06;
      letter-spacing: 0.02em;
    }

    .lead {
      max-width: 620px;
      margin: 22px 0 0;
      color: #e4cf98;
      font-size: 18px;
      font-weight: 700;
    }

    .support-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      margin-top: 28px;
      padding: 22px;
      border: 1px solid rgba(198, 164, 93, 0.16);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(198, 164, 93, 0.08), rgba(8, 5, 3, 0.92));
    }

    .support-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .mail-link {
      color: var(--gold-bright);
      font: 900 18px/1.3 "Noto Serif SC", "Songti SC", serif;
      word-break: break-word;
      align-self: center;
    }

    .form-shell {
      padding: 28px;
    }

    .form-shell > * {
      position: relative;
      z-index: 1;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .panel-head p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .contact-form {
      display: grid;
      gap: 18px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--ivory);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .field label span {
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(198, 164, 93, 0.18);
      border-radius: 16px;
      background: rgba(7, 5, 3, 0.88);
      color: var(--ivory);
      font: 600 15px/1.5 "Noto Sans SC", "PingFang SC", sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .field input,
    .field select {
      min-height: 52px;
      padding: 0 16px;
    }

    .field textarea {
      min-height: 162px;
      padding: 14px 16px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(241, 211, 139, 0.48);
      box-shadow: 0 0 0 4px rgba(198, 164, 93, 0.12);
      transform: translateY(-1px);
    }

    .submit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
    }

    .submit-btn {
      min-width: 180px;
      min-height: 54px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #e5c57b, #b88d45);
      color: #241607;
      font: 900 16px/1 "Noto Serif SC", "Songti SC", serif;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .submit-btn:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .status {
      display: none;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(198, 164, 93, 0.14);
      background: var(--panel-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .status.is-visible {
      display: block;
    }

    .status[data-tone="success"] {
      color: var(--success);
      border-color: rgba(150, 212, 160, 0.24);
    }

    .status[data-tone="error"] {
      color: var(--danger);
      border-color: rgba(240, 165, 143, 0.22);
    }

    .status[data-tone="neutral"] {
      color: var(--gold-bright);
      border-color: rgba(198, 164, 93, 0.18);
    }

    .copyright {
      margin-top: 30px;
      padding: 18px 20px 0;
      border-top: 1px solid rgba(198, 164, 93, 0.1);
      color: #8f7b56;
      font-size: 13px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-panel,
      .form-shell {
        border-radius: 22px;
      }
    }

    @media (max-width: 760px) {
      .nav-inner,
      .wrap {
        width: 100%;
      }

      .nav-inner {
        min-height: 62px;
        padding: 0 18px;
      }

      .wrap {
        padding: 30px 18px 62px;
      }

      .hero-panel,
      .form-shell {
        padding: 24px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 38px;
      }

      .lead {
        font-size: 16px;
      }

      .field-grid,
      .submit-row,
      .support-card {
        grid-template-columns: 1fr;
      }

      .submit-row {
        display: grid;
      }

      .submit-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html">
        <img class="brand-logo" src="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.png" alt="" aria-hidden="true" loading="eager" decoding="async">
        <span>阅天</span>
      </a>
      <a class="back-link" href="../index.html">返回首页</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-label="联系与提交问题">
      <article class="hero-panel">
        <span class="kicker">Contact Desk</span>
        <h1>有问题，<br>直接提交。</h1>
        <p class="lead">写清问题与联系方式，即可快速处理。</p>

        <div class="support-card">
          <div>
            <h2>邮箱</h2>
            <p>也可直接邮件联系。</p>
          </div>
          <a class="mail-link" href="mailto:842598522@qq.com">842598522@qq.com</a>
        </div>

        <div class="copyright">
          粤ICP备2026055337号 · © 2026 阅天AI · Powered by 阅天工作室
        </div>
      </article>

      <section class="form-shell" aria-labelledby="ticket-title">
        <div class="panel-head">
          <div>
            <span class="kicker">Submit Ticket</span>
            <h2 id="ticket-title" style="margin-top:12px;font-size:32px;">提交</h2>
            <p>信息将直达邮箱。</p>
          </div>
        </div>

        <form id="contactForm" class="contact-form" novalidate>
          <div class="field">
            <label for="contactValue">联系方式</label>
            <input id="contactValue" name="contact" type="text" maxlength="120" required placeholder="手机号 / 邮箱">
          </div>

          <div class="field">
            <label for="issueTitle">问题标题</label>
            <input id="issueTitle" name="title" type="text" maxlength="80" required placeholder="一句话说明">
          </div>

          <div class="field">
            <label for="message">详细描述</label>
            <textarea id="message" name="message" maxlength="2000" required placeholder="问题、报错、时间。"></textarea>
          </div>

          <div class="sr-only" aria-hidden="true">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
          </div>

          <div id="contactStatus" class="status" data-tone="neutral" role="status" aria-live="polite"></div>

          <div class="submit-row">
            <button id="submitBtn" class="submit-btn" type="submit">提交</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script>
    (function () {
      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('contactStatus');

      function trimValue(value) {
        return String(value || '').replace(/\s+/g, ' ').trim();
      }

      function getApiBase() {
        const qs = new URLSearchParams(window.location.search);
        const queryBase = qs.get('apiBase') || qs.get('aiBackendBase') || qs.get('pimingApiBase') || '';
        const configBase = window.SITE_CONFIG && window.SITE_CONFIG.aiBackendBase;
        if (queryBase) return queryBase.replace(/\/+$/, '');
        if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/i.test(window.location.hostname)) {
          return 'http://localhost:3001';
        }
        return (configBase || 'https://api.yuetianai.com').replace(/\/+$/, '');
      }

      function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.dataset.tone = tone || 'neutral';
        statusEl.classList.add('is-visible');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const payload = {
          issueType: 'service',
          contact: trimValue(form.contact.value),
          title: trimValue(form.title.value),
          name: '',
          pageUrl: '',
          accountInfo: '',
          evidenceLink: '',
          message: String(form.message.value || '').trim(),
          company: trimValue(form.company.value)
        };

        if (!payload.contact || !payload.title || !payload.message) {
          setStatus('请先填写联系方式、问题标题和详细描述。', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        setStatus('正在提交，请稍候...', 'neutral');

        try {
          const response = await fetch(getApiBase() + '/api/contact/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok || !data.ok) {
            throw new Error(data.error || '提交失败，请稍后再试。');
          }

          form.reset();
          setStatus(data.message || '已收到你的问题，我们会尽快处理。', 'success');
        } catch (error) {
          setStatus(error && error.message ? error.message : '提交失败，请稍后再试。', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '提交';
        }
      });
    }());
  </script>
</body>
</html>
