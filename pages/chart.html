<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅天 · 原版排盘已迁移</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0a08;
      --panel: #17110c;
      --gold: #f1d47d;
      --gold-soft: rgba(241, 212, 125, .18);
      --ivory: #fff3d4;
      --muted: #a99878;
      --copper: #a45d39;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--muted);
      background:
        linear-gradient(90deg, rgba(241, 212, 125, .032) 1px, transparent 1px),
        linear-gradient(0deg, rgba(241, 212, 125, .024) 1px, transparent 1px),
        radial-gradient(circle at 70% 18%, rgba(164, 93, 57, .16), transparent 34%),
        var(--bg);
      background-size: 88px 88px, 88px 88px, auto, auto;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("../images/home2/hero-bg.webp") center top / cover no-repeat;
      opacity: .18;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 max(24px, calc((100vw - 1120px) / 2));
      border-bottom: 1px solid rgba(241, 212, 125, .12);
      background: rgba(21, 16, 12, .95);
      backdrop-filter: blur(14px);
    }

    .brand,
    .links {
      display: flex;
      align-items: center;
    }

    .brand {
      gap: 10px;
      color: var(--gold);
      font: 800 22px/1 "Noto Serif SC", "Songti SC", serif;
    }

    .brand img {
      width: 22px;
      height: 22px;
    }

    .links {
      gap: 10px;
    }

    .links a {
      padding: 9px 16px;
      border-radius: 8px;
      color: #b9a875;
      font-weight: 700;
    }

    .links a.is-active {
      color: var(--gold);
      background: rgba(241, 212, 125, .1);
    }

    main {
      width: min(1120px, calc(100vw - 48px));
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 72px 0;
    }

    .panel {
      width: min(860px, 100%);
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 5vw, 56px);
      border: 1px solid rgba(241, 212, 125, .22);
      border-radius: 22px;
      background:
        radial-gradient(circle at 88% 10%, rgba(241, 212, 125, .11), transparent 28%),
        linear-gradient(145deg, rgba(29, 20, 12, .96), rgba(10, 7, 4, .95));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 240, 190, .06);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(241, 212, 125, .32), transparent) top / 100% 1px no-repeat,
        radial-gradient(circle at 20% 84%, rgba(164, 93, 57, .13), transparent 32%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid rgba(241, 212, 125, .22);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(241, 212, 125, .07);
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 24px 0 14px;
      color: var(--ivory);
      font: 900 clamp(34px, 6vw, 62px)/1.12 "Noto Serif SC", "Songti SC", serif;
      letter-spacing: 0;
    }

    p {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.85;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .primary,
    .ghost {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: 999px;
      font-weight: 900;
    }

    .primary {
      border: 1px solid rgba(255, 232, 190, .28);
      background: linear-gradient(135deg, #d5bb69, #b96f42);
      color: #16100b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .24);
    }

    .ghost {
      border: 1px solid rgba(241, 212, 125, .18);
      background: rgba(241, 212, 125, .05);
      color: var(--gold);
    }

    .note {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(241, 212, 125, .12);
      color: rgba(169, 152, 120, .78);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .nav {
        height: auto;
        min-height: 58px;
        padding: 12px 18px;
      }

      .links {
        display: none;
      }

      main {
        width: min(390px, calc(100vw - 24px));
        padding: 42px 0;
      }

      .panel {
        padding: 28px 22px;
        border-radius: 18px;
      }

      .actions a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="../index.html" aria-label="阅天首页">
      <img src="../images/logo-mark.svg" alt="">
      <span>阅天</span>
    </a>
    <nav class="links" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="mingbook-onepage.html" class="is-active">命书长页</a>
      <a href="wentian-app.html">手机端入口</a>
    </nav>
  </header>

  <main>
    <section class="panel" aria-labelledby="page-title">
      <div class="content">
        <span class="kicker">原版排盘功能迁移中</span>
        <h1 id="page-title">请使用新版命书长页</h1>
        <p>
          原版排盘页正在逐步下线，排盘、命盘解读、AI半仙追问、深度报告等能力已经合并到新版命书长页。
          这里先保留安全入口，不再加载旧版排盘功能。
        </p>

        <div class="actions">
          <a class="primary" id="go-mingbook" href="mingbook-onepage.html">进入命书长页</a>
          <a class="ghost" href="../index.html">返回首页</a>
        </div>

        <div class="note">
          如果你之前从旧链接进入，请直接使用命书长页继续排盘和解读。后续会继续清理旧页面残留资源，但不会影响新版命书长页。
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var link = document.getElementById('go-mingbook');
      if (!link) return;
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      link.href = 'mingbook-onepage.html' + query + hash;
    }());
  </script>
</body>
</html>
