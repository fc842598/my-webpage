<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问天AI App 静态原型</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/wentian-prototype.css">
  <script defer src="../js/wentian-prototype.js"></script>
</head>
<body>
  <main class="prototype-shell">
    <button class="prototype-scrim" type="button" data-action="close-menu" aria-label="关闭目录"></button>
    <aside class="prototype-sidebar" aria-label="原型页面列表">
      <div class="sidebar-head">
        <p>问天AI App</p>
        <h1>页面目录</h1>
      </div>
      <div class="sidebar-actions">
        <button class="tool-btn" type="button" data-action="home">首页</button>
        <button class="tool-btn" type="button" data-action="toggle-hotspots">热区</button>
      </div>
      <nav class="screen-list" id="screenList"></nav>
    </aside>

    <section class="prototype-stage" aria-live="polite">
      <header class="stage-bar">
        <div>
          <p id="screenMeta">PX 02</p>
          <h2 id="screenTitle">首页/报告商城</h2>
        </div>
        <div class="stage-actions">
          <button class="text-btn" type="button" data-action="toggle-menu">目录</button>
          <button class="icon-btn" type="button" data-action="back" aria-label="返回上一屏">←</button>
          <button class="icon-btn" type="button" data-action="prev" aria-label="上一张">‹</button>
          <button class="icon-btn" type="button" data-action="next" aria-label="下一张">›</button>
        </div>
      </header>

      <div class="phone-scroll">
        <div class="phone-canvas" id="phoneCanvas">
          <img id="screenImage" alt="">
          <div class="hotspot-layer" id="hotspotLayer"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
