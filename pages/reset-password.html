<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>重置密码｜阅天AI</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.webp" type="image/webp">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f0e3;color:#251d18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.card{width:min(100%,430px);padding:28px;border:1px solid #e1cda9;border-radius:24px;background:#fffaf2;box-shadow:0 18px 50px rgba(90,59,28,.12)}h1{margin:0 0 8px;font-size:28px}p{line-height:1.65;color:#786a5c}.field{display:grid;gap:8px;margin:18px 0}.field span{font-weight:800}.field input{width:100%;min-height:48px;padding:0 14px;border:1px solid #d9c7aa;border-radius:12px;background:#fff;font-size:17px}.field input:focus{outline:2px solid rgba(143,61,48,.18);border-color:#8f3d30}button{width:100%;min-height:50px;border:0;border-radius:999px;background:#8f3d30;color:#fff;font-size:18px;font-weight:900;cursor:pointer}button:disabled{opacity:.6}.status{min-height:24px;margin:14px 0 0;text-align:center;font-weight:700}.status.error{color:#a12620}.status.ok{color:#356e49}.back{display:block;margin-top:18px;text-align:center;color:#715d43}
  </style>
</head>
<body>
  <main class="card">
    <h1>设置新密码</h1>
    <p>请输入至少6位的新密码。设置完成后，电脑端和手机端都可以使用新密码登录。</p>
    <form id="form">
      <input type="email" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" hidden>
      <label class="field"><span>新密码</span><input id="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label>
      <label class="field"><span>再次输入</span><input id="confirm" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label>
      <button id="submit" type="submit">确认修改</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a class="back" href="/yl.html#member">返回登录</a>
  </main>
  <script>
    (function(){
      var params=new URLSearchParams((location.hash||'').replace(/^#/,''));
      var accessToken=params.get('access_token')||'';
      var type=params.get('type')||'';
      var form=document.getElementById('form');
      var status=document.getElementById('status');
      function message(text,tone){status.textContent=text;status.className='status '+(tone||'');}
      if(!accessToken||type!=='recovery'){
        form.hidden=true;message('重置链接无效或已经过期，请返回登录页重新申请。','error');
      }
      form.addEventListener('submit',async function(event){
        event.preventDefault();
        var password=document.getElementById('password').value;
        var confirm=document.getElementById('confirm').value;
        if(password.length<6){message('密码至少6位。','error');return;}
        if(password!==confirm){message('两次输入的密码不一致。','error');return;}
        var button=document.getElementById('submit');button.disabled=true;message('正在修改…','');
        try{
          var response=await fetch('https://api.yuetianai.com/api/auth/password',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:password})});
          var data=await response.json().catch(function(){return{};});
          if(!response.ok||data.error)throw new Error(data.error||'修改失败');
          form.hidden=true;message('密码修改成功，现在可以用新密码登录。','ok');
          history.replaceState({},document.title,location.pathname);
        }catch(error){message(error.message||'修改失败，请重新申请重置链接。','error');button.disabled=false;}
      });
    })();
  </script>
</body>
</html>
