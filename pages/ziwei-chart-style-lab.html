<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <title>紫微命盘样式实验页｜阅天AI</title>
  <link rel="icon" href="../images/wentian-prototype-assets/wentian-brand-logo-ai-gold-v1.webp" type="image/webp">
  <link rel="stylesheet" href="../css/ziwei-chart-style-lab.css?v=20260824-mutagen-labels-v1">
</head>
<body class="chart-style-lab">
  <main class="lab-shell">
    <header class="lab-header">
      <a class="lab-back" href="./wentian-app.html#screen-27">返回正式命盘</a>
      <div class="lab-heading">
        <h1>紫微命盘</h1>
      </div>
      <span class="lab-status">测试页</span>
    </header>

    <section class="chart-section" aria-label="十二宫命盘样式实验">
      <div class="chart-board" id="chartBoard" data-birth-year-branch="辰" data-sex="male">
        <canvas class="triad-overlay" id="triadOverlay" aria-hidden="true"></canvas>
        <button class="palace-cell p-1" type="button" data-palace="疾厄宫" data-branch="甲寅" data-stars="廉贞庙" aria-pressed="false">
          <span class="major-stars">廉贞庙</span>
          <span class="minor-stars">文曲平<br>天马<br>天贵</span>
          <span class="stem-age">甲寅<br>76–85</span>
          <span class="support-stars">长生<br>大耗</span>
          <strong>疾厄宫</strong>
        </button>

        <button class="palace-cell p-2" type="button" data-palace="财帛宫" data-branch="乙卯" data-stars="天官、天福" aria-pressed="false">
          <span class="minor-stars">天官<br>天福</span>
          <span class="stem-age">乙卯<br>86–95</span>
          <span class="support-stars">沐浴<br>伏兵</span>
          <strong>身宫<br>财帛宫</strong>
        </button>

        <button class="palace-cell p-3" type="button" data-palace="子女宫" data-branch="丙辰" data-stars="破军旺" aria-pressed="false">
          <span class="major-stars">破军旺</span>
          <span class="minor-stars">陀罗庙<br>天姚<br>台辅</span>
          <span class="stem-age">丙辰<br>96–105</span>
          <span class="support-stars">冠带<br>官府</span>
          <strong>子女宫</strong>
        </button>

        <button class="palace-cell p-4" type="button" data-palace="夫妻宫" data-branch="丁巳" data-stars="天同庙、禄存" aria-pressed="false">
          <span class="major-stars">天同庙<br><i class="mutagen mutagen-lu">禄</i>存</span>
          <span class="minor-stars">天喜<br>天空<br>孤辰</span>
          <span class="stem-age">丁巳<br>106–115</span>
          <span class="support-stars">临官<br>博士</span>
          <strong>夫妻宫</strong>
        </button>

        <button class="palace-cell p-5" type="button" data-palace="兄弟宫" data-branch="戊午" data-stars="武曲旺、天府旺" aria-pressed="false">
          <span class="major-stars">武曲旺<br>天府旺</span>
          <span class="minor-stars">擎羊陷<br>八座<br>凤阁</span>
          <span class="stem-age">戊午<br>116–125</span>
          <span class="support-stars">帝旺<br>力士</span>
          <strong>兄弟宫</strong>
        </button>

        <button class="palace-cell p-6 is-active" type="button" data-palace="命宫" data-branch="己未" data-stars="太阳得、太阴不" aria-pressed="true">
          <span class="major-stars major-stars--with-mutagen">
            <span class="major-star-row"><span>太阳得</span><i class="mutagen mutagen-label mutagen-quan">化权</i></span>
            <span class="major-star-row"><span>太阴不</span><i class="mutagen mutagen-label mutagen-ke">化科</i></span>
          </span>
          <span class="minor-stars">左辅<br>右弼<br>天钺</span>
          <span class="stem-age">己未<br>6–15</span>
          <span class="support-stars">衰<br>青龙</span>
          <strong>命宫</strong>
        </button>

        <section class="chart-center" aria-label="命盘基本资料">
          <div class="center-title">
            <h3>紫微排盘</h3>
            <em>阳男 · 火六局 · 属龙</em>
          </div>
          <dl class="profile-facts">
            <div><dt>命主</dt><dd>陈农历</dd></div>
            <div><dt>公历</dt><dd>1988-06-10 20:40</dd></div>
            <div><dt>真太阳时</dt><dd>19:02 · 戌时</dd></div>
            <div><dt>农历</dt><dd>四月廿六</dd></div>
          </dl>
          <div class="flow-controls" aria-label="小流年切换">
            <div class="flow-select-row">
              <label for="flowAge">小流年</label>
              <select id="flowAge" aria-label="选择小流年年龄"></select>
            </div>
            <p id="flowStatus" aria-live="polite">39岁 · 仆役宫 · 同轮37–48岁</p>
          </div>
        </section>

        <button class="palace-cell p-7" type="button" data-palace="父母宫" data-branch="庚申" data-stars="贪狼平、铃星陷" aria-pressed="false">
          <span class="major-stars major-stars--with-mutagen">
            <span class="major-star-row"><span>贪狼平</span><i class="mutagen mutagen-label mutagen-lu">化禄</i></span>
          </span>
          <span class="minor-stars">铃星陷<br>三台<br>龙池</span>
          <span class="stem-age">庚申<br>16–25</span>
          <span class="support-stars">病<br>小耗</span>
          <strong>父母宫</strong>
        </button>

        <button class="palace-cell p-8" type="button" data-palace="福德宫" data-branch="辛酉" data-stars="天机旺、巨门庙" aria-pressed="false">
          <span class="major-stars major-stars--with-mutagen">
            <span class="major-star-row"><span>天机旺</span><i class="mutagen mutagen-label mutagen-ji">化忌</i></span>
            <span class="major-star-row"><span>巨门庙</span></span>
          </span>
          <span class="minor-stars">地劫<br>咸池<br>月德</span>
          <span class="stem-age">辛酉<br>26–35</span>
          <span class="support-stars">死<br>将军</span>
          <strong>福德宫</strong>
        </button>

        <button class="palace-cell p-9" type="button" data-palace="田宅宫" data-branch="壬戌" data-stars="紫微得、天相得" aria-pressed="false">
          <span class="major-stars">紫微得<br>天相得</span>
          <span class="minor-stars">解神<br>旬空<br>天虚</span>
          <span class="stem-age">壬戌<br>36–45</span>
          <span class="support-stars">墓<br>奏书</span>
          <strong>田宅宫</strong>
        </button>

        <button class="palace-cell p-10" type="button" data-palace="官禄宫" data-branch="癸亥" data-stars="天梁陷" aria-pressed="false">
          <span class="major-stars">天梁陷</span>
          <span class="minor-stars">红鸾<br>天才<br>天巫</span>
          <span class="stem-age">癸亥<br>46–55</span>
          <span class="support-stars">绝<br>飞廉</span>
          <strong>官禄宫</strong>
        </button>

        <button class="palace-cell p-11" type="button" data-palace="仆役宫" data-branch="甲子" data-stars="七杀旺、文昌得" aria-pressed="false">
          <span class="major-stars">七杀旺<br>文昌得</span>
          <span class="minor-stars">火星陷<br>恩光<br>封诰</span>
          <span class="stem-age">甲子<br>56–65</span>
          <span class="support-stars">胎<br>喜神</span>
          <strong>仆役宫</strong>
        </button>

        <button class="palace-cell p-12" type="button" data-palace="迁移宫" data-branch="乙丑" data-stars="天魁、地空" aria-pressed="false">
          <span class="major-stars">天魁</span>
          <span class="minor-stars">地空<br>天德<br>寡宿</span>
          <span class="stem-age">乙丑<br>66–75</span>
          <span class="support-stars">养<br>病符</span>
          <strong>迁移宫</strong>
        </button>
      </div>
    </section>

    <footer class="lab-footer">
      <p>此链接仅用于确认命盘视觉方向，正式页面与排盘逻辑均未修改。</p>
    </footer>
  </main>
  <script src="../js/ziwei-chart-style-lab.js?v=20260821-flow-cue-v3" defer></script>
</body>
</html>
