          return "";

      })();

        /\/pages\/wentian-app\.html/i.test(referrer) &&
        /(?:[?&](?:lang|language|wentianLanguage|locale)=en)(?:[&#]|$)/i.test(referrer);
      if (params.get("lang") === "en" || storedLang === "en" || fromEnglishWentian) {
        window.location.replace("/pages/wentian-app.html?lang=en#screen-17");
      }
    })();
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100%; min-height: 100dvh; overflow: hidden; }

    body {
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;
      background: #C8B888;
      color: #2A1810;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    #root {
      width: min(100vw, 390px);
      height: 100dvh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      background: #C8B888;
    }

    textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 0; }
    ::selection { background: rgba(122,35,24,0.12); }
    textarea::placeholder { color: #B8A090; }

    button { font-family: inherit; transition: opacity 0.15s, transform 0.12s; }
    button:active:not(:disabled) { opacity: 0.82; transform: scale(0.97); }

    /* ── Coin animations ── */
    @keyframes coinFlipAnim {
      0%   { transform: scaleX(1) translateY(0); }
      12%  { transform: scaleX(0.15) translateY(-20px); }
      24%  { transform: scaleX(1) translateY(-8px); }
      38%  { transform: scaleX(0.2) translateY(-15px); }
      52%  { transform: scaleX(1) translateY(-3px); }
      66%  { transform: scaleX(0.35) translateY(-9px); }
      78%  { transform: scaleX(1) translateY(-1px); }
      89%  { transform: scaleX(0.6) translateY(-3px); }
      100% { transform: scaleX(1) translateY(0); }
    }
    .coin-flip { animation: coinFlipAnim 1.1s cubic-bezier(0.4,0,0.2,1) both; }

    @keyframes coinPopIn {
      0%   { transform: scale(0.6); opacity: 0; }
      65%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .coin-pop { animation: coinPopIn 0.32s ease-out both; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    /* ── Vessel animations ── */
    @keyframes vesselSway {
      0%   { transform: translateX(-50%) rotate(-3deg) translateY(0px); }
      25%  { transform: translateX(-50%) rotate(2deg) translateY(-5px); }
      55%  { transform: translateX(-50%) rotate(-1.5deg) translateY(-7px); }
      80%  { transform: translateX(-50%) rotate(3deg) translateY(-3px); }
      100% { transform: translateX(-50%) rotate(-3deg) translateY(0px); }
    }
    @keyframes vesselRattle {
      0%,100%{ transform:translateX(-50%) translate(0,0) rotate(0); }
      6%  { transform:translateX(-50%) translate(-8px,-2px) rotate(-9deg); }
      12% { transform:translateX(-50%) translate(8px,2px) rotate(9deg); }
      18% { transform:translateX(-50%) translate(-10px,-4px) rotate(-12deg); }
      24% { transform:translateX(-50%) translate(10px,4px) rotate(12deg); }
      30% { transform:translateX(-50%) translate(-11px,-4px) rotate(-13deg); }
      36% { transform:translateX(-50%) translate(11px,4px) rotate(13deg); }
      42% { transform:translateX(-50%) translate(-9px,-3px) rotate(-10deg); }
      48% { transform:translateX(-50%) translate(9px,3px) rotate(10deg); }
      55% { transform:translateX(-50%) translate(-7px,-2px) rotate(-7deg); }
      62% { transform:translateX(-50%) translate(7px,2px) rotate(7deg); }
      70% { transform:translateX(-50%) translate(-4px,-1px) rotate(-4deg); }
      78% { transform:translateX(-50%) translate(4px,1px) rotate(4deg); }
      86% { transform:translateX(-50%) translate(-2px,0) rotate(-2deg); }
      93% { transform:translateX(-50%) translate(2px,0) rotate(2deg); }
    }
    @keyframes vesselTip {
      0%   { transform: translateX(-50%) rotate(0deg) translateY(0px); }
      25%  { transform: translateX(-50%) rotate(40deg) translateY(-4px); }
      55%  { transform: translateX(-50%) rotate(72deg) translateY(-8px); }
      80%  { transform: translateX(-50%) rotate(80deg) translateY(-6px); }
      100% { transform: translateX(-50%) rotate(76deg) translateY(-7px); }
    }

    /* ── Coin pour-out (from tilted shell opening) ── */
    @keyframes flyL {
      0%   { transform: translate(0px,0px) rotate(0deg) scale(0.55); opacity:0; }
      7%   { opacity:1; }
      28%  { transform: translate(-32px,-22px) rotate(195deg) scale(1.08); opacity:1; }
      62%  { transform: translate(-50px, 68px) rotate(420deg) scale(1); }
      80%  { transform: translate(-52px, 118px) rotate(500deg) scale(1); }
      92%  { transform: translate(-50px, 128px) rotate(530deg) scale(1); }
      100% { transform: translate(-50px, 125px) rotate(525deg) scale(1); opacity:1; }
    }
    @keyframes flyC {
      0%   { transform: translate(0px,0px) rotate(0deg) scale(0.55); opacity:0; }
      7%   { opacity:1; }
      32%  { transform: translate(5px,-32px) rotate(-185deg) scale(1.08); opacity:1; }
      62%  { transform: translate(4px, 72px) rotate(-400deg) scale(1); }
      80%  { transform: translate(3px, 122px) rotate(-490deg) scale(1); }
      92%  { transform: translate(3px, 132px) rotate(-520deg) scale(1); }
      100% { transform: translate(3px, 128px) rotate(-510deg) scale(1); opacity:1; }
    }
    @keyframes flyR {
      0%   { transform: translate(0px,0px) rotate(0deg) scale(0.55); opacity:0; }
      7%   { opacity:1; }
      35%  { transform: translate(38px,-18px) rotate(-210deg) scale(1.08); opacity:1; }
      62%  { transform: translate(55px, 65px) rotate(-440deg) scale(1); }
      80%  { transform: translate(58px, 115px) rotate(-530deg) scale(1); }
      92%  { transform: translate(56px, 126px) rotate(-560deg) scale(1); }
      100% { transform: translate(56px, 122px) rotate(-548deg) scale(1); opacity:1; }
    }

    /* ── Ripple rings ── */
    @keyframes rippleRing {
      0%   { transform: scale(0.85); opacity: 0.55; }
      100% { transform: scale(2.8);  opacity: 0; }
    }
    .ripple-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.8px solid rgba(196,144,58,0.45);
      animation: rippleRing 2.2s ease-out infinite;
      pointer-events: none;
    }
    .ripple-ring:nth-child(2) { animation-delay: 0.73s; }
    .ripple-ring:nth-child(3) { animation-delay: 1.46s; }

    /* ── Screen shake (body feedback) ── */
    @keyframes screenShake {
      0%,100%{ transform: translate(0,0); }
      15%{ transform: translate(-3px,1px); }
      30%{ transform: translate(3px,-2px); }
      45%{ transform: translate(-2px,2px); }
      60%{ transform: translate(2px,-1px); }
      75%{ transform: translate(-1px,1px); }
    }
    .screen-shake { animation: screenShake 0.5s ease-in-out; }

    @keyframes liuyaoReviewSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes liuyaoThinkingPulse {
      0%, 100% { opacity: 0.34; transform: scale(0.72); }
      50% { opacity: 1; transform: scale(1); }
    }
    .liuyao-review-spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(160, 120, 64, 0.26);
      border-top-color: currentColor;
      display: inline-block;
      animation: liuyaoReviewSpin 0.8s linear infinite;
    }
    .liuyao-thinking-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #946208;
      display: inline-block;
      box-shadow: 13px 0 0 rgba(148,98,8,0.45), 26px 0 0 rgba(148,98,8,0.22);
      animation: liuyaoThinkingPulse 1.05s ease-in-out infinite;
      margin-right: 24px;
    }
  </style>
